 3', Arial, sans-serif" font-size="12" font-weight="600" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="150" y="372.0">registrarSolicitud</tspan></text><circle cx="660" cy="320" r="12" fill="#1b365d"/><path d="M 672,326 L 782.0,363.0" fill="none" stroke="#1b365d" stroke-width="1.8" marker-end="url(#punta-1b365d)"/><rect x="596.64" y="289.5" width="186.72" height="21.0" rx="5" fill="#fff" opacity=".92"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="600" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="690" y="300.0">emitirEnLote (carga inicial)</tspan></text><path d="M 388.0,400 L 472.0,400" fill="none" stroke="#1b365d" stroke-width="1.8" marker-end="url(#punta-1b365d)"/><rect x="400.34" y="370.875" width="59.32" height="22.25" rx="5" fill="#fff" opacity=".92"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="600" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="430" y="382.0">validar</tspan></text><path d="M 648.0,400 L 772.0,400" fill="none" stroke="#1b365d" stroke-width="1.8" marker-end="url(#punta-1b365d)"/><rect x="633.02" y="370.875" width="153.96" height="22.25" rx="5" fill="#fff" opacity=".92"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="600" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="710" y="382.0">emitir · ancla huella</tspan></text><path d="M 300,437.0 L 300,650 L 342.0,650" fill="none" stroke="#b42318" stroke-width="1.8" marker-end="url(#punta-b42318)"/><path d="M 560,437.0 L 560,650 L 518.0,650" fill="none" stroke="#b42318" stroke-width="1.8" marker-end="url(#punta-b42318)"/><rect x="373.3" y="578.875" width="113.4" height="22.25" rx="5" fill="#fff" opacity=".92"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="600" fill="#b42318" text-anchor="middle" dominant-baseline="middle"><tspan x="430" y="590.0">rechaza