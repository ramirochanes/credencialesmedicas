<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><marker id="punta-1b365d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b365d"/></marker><marker id="punta-b42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="punta-8a99ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a99ad"/></marker></defs><rect width="1600" height="900" fill="#fff"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="24" font-weight="700" fill="#1b365d" text-anchor="start" dominant-baseline="middle"><tspan x="30" y="40.0">Contrato RegistroCredencialesMedicas · Diagrama de transición de estados</tspan></text><text font-family="'Source Sans 3', Arial, sans-serif" font-size="15" font-weight="400" fill="#12263f" text-anchor="start" dominant-baseline="middle"><tspan x="30" y="72.0">Activo: la matrícula (lógica, no transferible). Estados en los rectángulos; eventos (funciones) en las flechas; participantes como barras sobre los estados donde actúan.</tspan></text><rect x="212" y="120" width="1106" height="34" rx="17" fill="#1b365d"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="middle"><tspan x="765.0" y="137.0">Colegio · universidad · ministerio (emisor de origen): todas las transiciones</tspan></text><rect x="680" y="165" width="360" height="34" rx="17" fill="#0f7c8a"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="middle"><tspan x="860.0" y="182.0">Médico: QR, prueba de titularidad, cursos propios</tspan></text><rect x="212" y="210" width="1106" height="34" rx="17" fill="#dfe7f1"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="765.0" y="227.0">Hospital o clínica: deja constancia en cualquier estado (no cambia el estado)</tspan></text><rect x="680" y="255" width="360" height="34" rx="17" fill="#eef3f8"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="860.0" y="272.0">Cualquiera: asienta el vencimiento</tspan></text><line x1="300" y1="290" x2="300" y2="363.0" stroke="#d6dee8" stroke-dasharray="3 5"/><line x1="560" y1="290" x2="560" y2="363.0" stroke="#d6dee8" stroke-dasharray="3 5"/><line x1="860" y1="290" x2="860" y2="363.0" stroke="#d6dee8" stroke-dasharray="3 5"/><line x1="1230" y1="290" x2="1230" y2="363.0" stroke="#d6dee8" stroke-dasharray="3 5"/><rect x="212.0" y="363.0" width="176" height="74" rx="12" fill="#fff" stroke="#1b365d" stroke-width="1.8"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="700" fill="#12263f" text-anchor="middle" dominant-baseline="middle"><tspan x="300" y="400.0">Pendiente</tspan></text><rect x="472.0" y="363.0" width="176" height="74" rx="12" fill="#fff" stroke="#1b365d" stroke-width="1.8"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="700" fill="#12263f" text-anchor="middle" dominant-baseline="middle"><tspan x="560" y="392.0">Validada</tspan></text><text font-family="'Source Sans 3', Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6b80" text-anchor="middle" dominant-baseline="middle"><tspan x="560" y="420.0">(En trámite)</tspan></text><rect x="772.0" y="363.0" width="176" height="74" rx="12" fill="#fff" stroke="#1b365d" stroke-width="1.8"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="19" font-weight="700" fill="#12263f" text-anchor="middle" dominant-baseline="middle