-end="url(#punta-1b365d)"/><rect x="992.3199999999999" y="776.875" width="255.36" height="22.25" rx="5" fill="#fff" opacity=".92"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="13" font-weight="600" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="1120" y="788.0">vence por fecha (estando suspendida)</tspan></text><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#12263f" text-anchor="start" dominant-baseline="middle"><tspan x="40" y="820.0">Rectángulo de borde grueso = estado final. (acto) = exige la huella de la resolución que lo respalda.</tspan></text><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="400" fill="#12263f" text-anchor="start" dominant-baseline="middle"><tspan x="40" y="846.0">Consultar (QR, código o PDF) no cambia el estado. Gobernanza: da de alta instituciones y habilita cuentas, pero el contrato le impide cambiar estados.</tspan></text><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b365d" text-anchor="start" dominant-baseline="middle"><tspan x="40" y="872.0">Red: Polygon PoS, red principal · Contrato 0x374adD49ce1101BC440b431EC24eee36a6A98565 · no actualizable</tspan></text></svg>