<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 95 1510 510" width="1510" height="510"><defs><marker id="punta-1b365d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b365d"/></marker><marker id="punta-0f7c8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7c8a"/></marker></defs><rect width="1600" height="640" fill="#fff"/><path d="M 460 330 Q 760 170 1100 330 Q 760 490 460 330 Z" fill="#e3f2f3" stroke="#0f7c8a" stroke-width="2"/><circle cx="1050" cy="300" r="9" fill="#1b365d"/><path d="M 460 330 L 400 280 L 400 380 Z" fill="#e3f2f3" stroke="#0f7c8a" stroke-width="2"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="26" font-weight="700" fill="#1b365d" text-anchor="middle" dominant-baseline="middle"><tspan x="790" y="313.8">Validación de</tspan><tspan x="790" y="346.2">matrículas médicas</tspan></text><line x1="470" y1="150" x2="1100" y2="150" stroke="#1b365d" stroke-width="2"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f7c8a" text-anchor="middle" dominant-baseline="middle"><tspan x="785" y="110.0">OBJETIVO</tspan></text><text font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="600" fill="#12263f" text-anchor="middle" dominant-baseline="middle"><tspan x="785" y="132.0">Que cualquiera compruebe en segundos quién otorgó una matrícula, que no fue adulterada y si es válida hoy.</tspan></text><path d="M 70,330 L 390,330" fill="none" stroke="#1b365d" stroke-width="3" marker-end="url(#punta-1b365d)"/><text font-family="'Source Sans 3', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f7c8a" text-anchor="start" dominant-baseline="middle"><tspan x="70" y="200.0">ENTRADAS</tspan></text><text font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#12263f" text-a